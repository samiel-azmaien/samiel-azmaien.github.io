<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Totem agent identity and authorization</title>
  <desc id="desc">A presenter and receiver connected through an identity verification gate.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c9a8e" />
    </marker>
  </defs>
  <rect width="1200" height="675" fill="#f7f7f2" />
  <g stroke="#dedfd7" stroke-width="1">
    <path d="M0 48H1200M0 96H1200M0 144H1200M0 192H1200M0 240H1200M0 288H1200M0 336H1200M0 384H1200M0 432H1200M0 480H1200M0 528H1200M0 576H1200M0 624H1200" />
  </g>
  <text x="72" y="112" fill="#2d2926" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="500">Totem</text>
  <text x="74" y="158" fill="#718176" font-family="Inter, Arial, sans-serif" font-size="24" letter-spacing="1.5">AGENT IDENTITY + AUTHORIZATION</text>

  <g transform="translate(82 288)">
