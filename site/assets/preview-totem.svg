    <path d="M92 48H212M92 68H174" stroke="#aeb5ad" stroke-width="8" stroke-linecap="round" />
    <text x="38" y="137" fill="#2d2926" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Presenter</text>
    <text x="38" y="166" fill="#6f7571" font-family="Inter, Arial, sans-serif" font-size="18">Company A agent</text>
  </g>

  <path d="M374 383H494" stroke="#8c9a8e" stroke-width="4" marker-end="url(#arrow)" />

  <g transform="translate(500 257)">
    <rect width="200" height="252" rx="100" fill="#2d2926" />
    <circle cx="100" cy="88" r="45" fill="none" stroke="#68d6c2" stroke-width="8" />
    <path d="M78 88L94 104L126 70" fill="none" stroke="#68d6c2" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <text x="100" y="174" fill="#fffffa" font-family="Inter, Arial, sans-serif" font-size="20" font-weight="700" text-anchor="middle">VERIFY</text>
    <text x="100" y="205" fill="#c8d4c6" font-family="Inter, Arial, sans-serif" font-size="16" text-anchor="middle">identity · scope</text>
  </g>

  <path d="M706 383H826" stroke="#8c9a8e" stroke-width="4" marker-end="url(#arrow)" />

  <g transform="translate(846 288)">
    <rect width="272" height="190" rx="18" fill="#fffffa" stroke="#cfd3cb" stroke-width="3" />
    <circle cx="56" cy="58" r="19" fill="#15846e" />
    <path d="M92 48H212M92 68H174" stroke="#aeb5ad" stroke-width="8" stroke-linecap="round" />
    <text x="38" y="137" fill="#2d2926" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="600">Receiver</text>
    <text x="38" y="166" fill="#6f7571" font-family="Inter, Arial, sans-serif" font-size="18">Company B agent</text>
  </g>

  <text x="600" y="584" fill="#657466" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="middle" letter-spacing="1">EXACT REQUEST · CURRENT PERMISSION · AUDIT EVIDENCE</text>
